name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main runs these checks via deploy.yml
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose file
        run: docker compose -f infra/compose.yml --env-file .env.example config -q
      - name: Validate Caddyfile
        run: docker run --rm -e DOMAIN=example.com -e ACME_EMAIL=a@b.c -v "$PWD/infra/caddy:/etc/caddy:ro" caddy:2.11-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Build image
        run: docker build .
