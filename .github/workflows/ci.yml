name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main runs these checks via deploy.yml
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build # tsc --noEmit + vite build

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose file
        run: docker compose -f infra/compose.yml --env-file .env.example config -q
      - name: Validate Caddyfile
        run: docker run --rm -e DOMAIN=example.com -e ACME_EMAIL=a@b.c -v "$PWD/infra/caddy:/etc/caddy:ro" caddy:2.11-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Validate Alloy config
        run: docker run --rm -v "$PWD/infra/alloy:/etc/alloy:ro" grafana/alloy:v1.21.3 fmt /etc/alloy/config.alloy > /dev/null
      - name: Build API image
        run: docker build .
      - name: Build web image
        run: docker build web
