name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Rollback: deploy an existing image tag (commit SHA) without rebuilding"
        required: false

# One VM for both environments: never two deploys at once.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  checks:
    if: ${{ !inputs.image_tag }}
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-24.04
    outputs:
      app_image: ${{ steps.meta.outputs.app_image }}
      web_image: ${{ steps.meta.outputs.web_image }}
    steps:
      - uses: actions/checkout@v5
      - id: meta
        run: |
          echo "app_image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/${GITHUB_REPOSITORY,,}-web:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.app_image }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: web
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.web_image }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            SENTRY_DSN=${{ vars.SENTRY_DSN_WEB }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT_WEB }}
          # Uploads source maps to Sentry during the build (skipped when the secret is empty).
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # Same images, two environments: staging first, e2e tests against it, production only if they pass.
  staging:
    needs: build
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: staging
      app_image: ${{ needs.build.outputs.app_image }}
      web_image: ${{ needs.build.outputs.web_image }}
      release: ${{ github.sha }}
    secrets: inherit

  e2e:
    needs: staging
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: E2E tests against staging
        run: npm run test:e2e
        env:
          BASE_URL: ${{ needs.staging.outputs.url }}
          EXPECTED_VERSION: ${{ github.sha }}

  # Also runs alone for a rollback (workflow_dispatch with image_tag): no build, no staging.
  production:
    needs: [build, e2e]
    if: ${{ always() && (needs.e2e.result == 'success' || inputs.image_tag) }}
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: production
      app_image: ${{ needs.build.outputs.app_image || format('ghcr.io/{0}:{1}', github.repository, inputs.image_tag) }}
      web_image: ${{ needs.build.outputs.web_image || format('ghcr.io/{0}-web:{1}', github.repository, inputs.image_tag) }}
      release: ${{ inputs.image_tag || github.sha }}
    secrets: inherit
