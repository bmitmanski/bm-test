name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Rollback: deploy an existing image tag (commit SHA) without rebuilding"
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  checks:
    if: ${{ !inputs.image_tag }}
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      app_image: ${{ steps.meta.outputs.app_image }}
      web_image: ${{ steps.meta.outputs.web_image }}
    steps:
      - uses: actions/checkout@v5
      - id: meta
        run: |
          echo "app_image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/${GITHUB_REPOSITORY,,}-web:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.app_image }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.web_image }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || inputs.image_tag) }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}
    env:
      APP_IMAGE: ${{ needs.build.outputs.app_image || format('ghcr.io/{0}:{1}', github.repository, inputs.image_tag) }}
      WEB_IMAGE: ${{ needs.build.outputs.web_image || format('ghcr.io/{0}-web:{1}', github.repository, inputs.image_tag) }}
      SSH: ssh -i ~/.ssh/id_deploy ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Sync infra files
        run: rsync -az --delete --exclude .env -e "ssh -i ~/.ssh/id_deploy" infra/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/app/

      - name: Deploy
        run: |
          $SSH "docker login ghcr.io -u ${{ github.actor }} --password-stdin" <<< "${{ secrets.GITHUB_TOKEN }}"
          $SSH "/opt/app/scripts/deploy.sh ${APP_IMAGE,,} ${WEB_IMAGE,,}"

      - name: Smoke test
        run: |
          for _ in $(seq 1 10); do
            curl -fsS "https://${{ vars.DOMAIN }}/api/ready" && curl -fsS -o /dev/null "https://${{ vars.DOMAIN }}/" && exit 0
            sleep 3
          done
          exit 1
