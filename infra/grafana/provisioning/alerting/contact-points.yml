apiVersion: 1

contactPoints:
  - orgId: 1
    name: email
    receivers:
      - uid: email-main
        type: email
        settings:
          addresses: $ALERT_EMAIL # from the container env, see compose.yml
          singleEmail: true

policies:
  - orgId: 1
    receiver: email
    group_by: [grafana_folder, alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
