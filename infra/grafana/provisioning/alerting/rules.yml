# Grafana-managed alert rules. Edit here and redeploy; UI changes to provisioned rules are blocked.
# Each rule: A = query, (B = reduce for Loki), C = threshold -> fires when C is true for `for`.
apiVersion: 1
groups:
- orgId: 1
  name: bm-test
  folder: bm-test
  interval: 1m
  rules:
  - uid: app-down
    title: API is down
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 'up{job="app"}'
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    for: 1m
    noDataState: Alerting
    execErrState: Error
    labels:
      severity: critical
    annotations:
      summary: 'Alloy has not been able to scrape the API for a minute: the container is down or crash-looping.'
      dashboardUId: bm-test-app
  - uid: server-errors
    title: Server errors (5xx)
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 'sum(increase(http_errors_total{class="5xx"}[5m]))'
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
    annotations:
      summary: 'The API returned 5xx responses in the last 5 minutes. Details in the logs: {service="app", level="error"}.'
      dashboardUId: bm-test-app
  - uid: frontend-errors
    title: Frontend JS errors
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 'sum(increase(frontend_errors_total[5m]))'
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: Browsers reported unhandled JS errors in the last 5 minutes.
      dashboardUId: bm-test-app
  - uid: app-restarted
    title: API restarted
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 'changes(process_start_time_seconds{job="app"}[10m])'
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: The API process started again within the last 10 minutes (a crash or a deploy).
      dashboardUId: bm-test-app
  - uid: slow-requests
    title: Slow API (p95 > 1 s)
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 'histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m])))'
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 1
    for: 1m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: The 95th percentile response time is above 1 s.
      dashboardUId: bm-test-app
  - uid: disk-full
    title: Disk almost full
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: '1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}'
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.85
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
    annotations:
      summary: Disk / is more than 85% full.
      dashboardUId: bm-test-app
  - uid: memory-high
    title: Low memory
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.9
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: Server RAM is more than 90% used.
      dashboardUId: bm-test-app
  - uid: postgres-errors
    title: Errors in Postgres logs
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: loki
      model:
        refId: A
        expr: 'sum(count_over_time({service="postgres"} |= "ERROR" [5m]))'
        queryType: range
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: Postgres logged an ERROR in the last 5 minutes (an alert based on logs, not metrics).
      dashboardUId: bm-test-app
