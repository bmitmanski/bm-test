# Staging stack: the same images as production, its own data. Runs on the same VM, next to production:
#   cd /opt/app && docker compose -f compose.staging.yml --env-file .env.staging up -d
# Production's Caddy (compose.yml) is the edge for both and reaches staging over the shared "edge" network.
# Public services are named staging-* so their DNS names on that network can't clash with production's app/web.
name: staging

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  staging-app:
    image: ${APP_IMAGE:-bm-test:local}
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEBUG_ROUTES: ${DEBUG_ROUTES:-true} # staging is where the test-failure buttons live
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: staging
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: ${S3_BUCKET:?}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_started }
    networks: [default, edge]
    mem_limit: 384m # a leak or load test on staging can't starve production
    logging: *logging

  staging-web:
    image: ${WEB_IMAGE:-bm-test-web:local}
    restart: unless-stopped
    networks: [default, edge]
    mem_limit: 64m
    logging: *logging

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes: [pg_data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10
    mem_limit: 256m
    logging: *logging

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 64m
    logging: *logging

  s3:
    image: chrislusf/seaweedfs:4.51
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<JSON
        {"identities":[{"name":"app","credentials":[{"accessKey":"$${S3_ACCESS_KEY}","secretKey":"$${S3_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        JSON
        exec weed server -dir=/data -volume.max=0 -master.volumeSizeLimitMB=1024 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
    volumes: [s3_data:/data]
    mem_limit: 256m
    logging: *logging

networks:
  edge:
    external: true # created by compose.yml (deploy.sh shared runs first)

volumes:
  pg_data:
  redis_data:
  s3_data:
