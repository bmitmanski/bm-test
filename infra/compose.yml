# Production stack plus the shared edge proxy and observability. Lives in /opt/app on the VPS, next to its .env.
# Staging runs next to it from compose.staging.yml.
name: app

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
      GRAFANA_BASIC_AUTH_HASH: ${GRAFANA_BASIC_AUTH_HASH:?}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [default, edge]
    depends_on: [app, web, grafana]
    logging: *logging

  app:
    image: ${APP_IMAGE:-bm-test:local}
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEBUG_ROUTES: ${DEBUG_ROUTES:-false}
      SENTRY_DSN: ${SENTRY_DSN:-} # empty = Sentry disabled
      SENTRY_ENVIRONMENT: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: ${S3_BUCKET:?}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_started }
    logging: *logging

  web:
    image: ${WEB_IMAGE:-bm-test-web:local}
    restart: unless-stopped
    logging: *logging

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes: [pg_data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging: *logging

  # S3-compatible object storage (MinIO community stopped shipping images in 2025).
  s3:
    image: chrislusf/seaweedfs:4.51
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    # volume.max=0 sizes the volume count from free disk / volume size. With the default 30 GB volumes a small VM
    # disk only fits ~1, writes then fail with "No writable volumes" while /ready still passes. 1 GB volumes fix that.
    command:
      - |
        cat > /tmp/s3.json <<JSON
        {"identities":[{"name":"app","credentials":[{"accessKey":"$${S3_ACCESS_KEY}","secretKey":"$${S3_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        JSON
        exec weed server -dir=/data -volume.max=0 -master.volumeSizeLimitMB=1024 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
    volumes: [s3_data:/data]
    logging: *logging

  # --- observability: Alloy collects logs (-> Loki) and metrics (-> Prometheus), Grafana shows both ---
  loki:
    image: grafana/loki:3.7
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    logging: *logging

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver # Alloy pushes metrics here
    volumes: [prometheus_data:/prometheus]
    logging: *logging

  alloy:
    image: grafana/alloy:v1.21.3
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy
      # Host metrics (CPU, RAM, disk) for prometheus.exporter.unix
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    networks: [default, edge] # edge: scrapes staging-app metrics
    depends_on: [loki, prometheus]
    logging: *logging

  grafana:
    image: grafana/grafana:13.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Alert notifications. Without SMTP alerts still fire, but only show up in the Grafana UI.
      ALERT_EMAIL: ${ALERT_EMAIL:-${ACME_EMAIL}}
      GF_SMTP_ENABLED: ${SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${SMTP_HOST:-}
      GF_SMTP_USER: ${SMTP_USER:-}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM:-${SMTP_USER:-admin@grafana.localhost}} # Gmail requires From = SMTP_USER
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [loki, prometheus]
    logging: *logging

networks:
  # Shared with compose.staging.yml: Caddy reaches staging-app and staging-web through it.
  edge:
    name: edge

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  redis_data:
  s3_data:
  loki_data:
  prometheus_data:
  alloy_data:
  grafana_data:
